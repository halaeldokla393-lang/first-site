<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsletter - V Cola</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(to right, #5bbcff, #2d8cff);
  color: white;
  text-align: center;
}
.navbar {
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 20px;
}

.navbar a {
  color: white;
  text-decoration: none;
  font-size: 18px;
}

.navbar a:hover {
  color: orange;
}

.newsletter {
  padding: 60px;
}

form {
  background: rgba(255,255,255,0.1);
  padding: 30px;
  border-radius: 15px;
  width: 300px;
  margin: auto;
}

input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: none;
  border-radius: 8px;
}

button {
  padding: 12px;
  width: 100%;
  background: orange;
  border: none;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #ff6a00;
}

#msg {
  margin-top: 15px;
}

.back-btn {
  display: inline-block;
  margin-top: 30px;
  padding: 10px 20px;
  background: white;
  color: #333;
  text-decoration: none;
  border-radius: 8px;
}
</style>

</head>
<body>

<!-- Navbar -->
<div class="navbar">
  <a href="v.html">Home</a>
  <a href="page2.html">Products</a>
  <a href="about.html">Newsletter</a>
  <a href="contact.html">Contact</a>
</div>

<!-- Content -->
<section class="newsletter">
  <h1>Subscribe to our Newsletter</h1>
  <p>Get the latest updates and offers</p>

  <form id="form">
    <input type="email" id="email" placeholder="Enter your email">
    <button type="submit">Subscribe</button>
  </form>

  <p id="msg"></p>

  <!-- زر الرجوع -->
  <a href="v.html" class="back-btn">⬅ Back to Home</a>
</section>

<script>
document.getElementById("form").addEventListener("submit", function(e){
  e.preventDefault();

  let email = document.getElementById("email").value;
  let msg = document.getElementById("msg");

  if(email === ""){
    msg.innerText = "Please enter your email!";
    msg.style.color = "red";
  } else {
    msg.innerText = "Subscribed successfully 🎉";
    msg.style.color = "lightgreen";
  }
});
</script>

</body>
</html>
